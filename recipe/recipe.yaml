context:
  version: 0.3.10
  python_min: '3.14'

package:
  name: pixi-diff-to-markdown
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pixi-diff-to-markdown/pixi_diff_to_markdown-${{ version }}.tar.gz
  sha256: 0f00b53c51d6822b4bffc4c8653dd39cefe82b7616857bdd455b36cba93bcc60

build:
  python:
    entry_points:
      - pixi-diff-to-markdown = pixi_diff_to_markdown.__main__:app
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.13.4,<3
    - py-rattler >=0.23.2,<0.24
    - ordered-enum >=0.0.10,<0.0.11
    - typer >=0.27.2,<0.28
    - pydantic-settings >=2.14.1,<3
    - more-itertools >=11.0.2,<12
tests:
  - python:
      imports:
        - pixi_diff_to_markdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pixi-diff-to-markdown --help
      - pixi-diff-to-markdown --version

about:
  homepage: https://github.com/pavelzw/pixi-diff-to-markdown
  repository: https://github.com/pavelzw/pixi-diff-to-markdown
  documentation: https://pixi.sh/latest/advanced/updates_github_actions
  summary: Tool for converting `pixi update` diffs to markdown
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pavelzw
